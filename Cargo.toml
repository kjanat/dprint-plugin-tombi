[package]
name = "dprint-plugin-tombi"
version = "0.1.0"
edition = "2024"
description = "A sandboxed dprint plugin for formatting TOML with Tombi"
repository = "https://github.com/kjanat/dprint-plugin-tombi"
license = "MIT"
readme = "README.md"
publish = false
keywords = ["dprint", "formatter", "tombi", "toml", "wasm"]
categories = ["development-tools", "text-editors"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-schema"
path = "src/bin/generate_schema.rs"
required-features = ["schema"]

[dependencies]
anyhow = "1"
dprint-core = { version = "0.69.1", features = ["wasm"] }
itertools = "0.14"
schemars = { version = "1.2.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upstream Tombi v1.5.5 plus a single headless-build portability commit.
# Formatter/parser algorithms are unchanged; see UPSTREAM.md for the exact diff.
tombi-config = { git = "https://github.com/kjanat/tombi", rev = "b7d9225298676fde124c9cace387e0d846c64ec0", features = ["serde"] }
tombi-formatter = { git = "https://github.com/kjanat/tombi", rev = "b7d9225298676fde124c9cace387e0d846c64ec0" }
tombi-schema-store = { git = "https://github.com/kjanat/tombi", rev = "b7d9225298676fde124c9cace387e0d846c64ec0", default-features = false }

[features]
default = []
schema = ["dep:schemars", "tombi-config/jsonschema"]

[lints.rust]
warnings = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
