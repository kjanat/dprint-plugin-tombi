#:schema https://www.schemastore.org/cargo.json
#:tombi schema.strict = false
#:tombi toml-version = "v1.0.0"

[package]
name        = "dprint-plugin-tombi"
version     = "0.1.0"
edition     = "2024"
description = "A dprint plugin for formatting TOML files using Tombi"
repository  = "https://github.com/kjanat/dprint-plugin-tombi"
license     = "MIT"
keywords    = ["dprint", "formatter", "tombi", "toml", "wasm"]
categories  = ["development-tools", "wasm"]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name              = "generate-schema"
path              = "src/bin/generate_schema.rs"
required-features = ["schema"]

[dependencies]
anyhow             = "1.0"
dprint-core        = { version = "0.67.4", features = ["wasm"] }
schemars           = { version = "1.0", optional = true }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = { version = "1.0", features = ["preserve_order"] }
tombi-config       = { version = "0.0.0-dev", features = ["serde"] }
tombi-parser       = { version = "0.0.0-dev" }
tombi-toml-version = { version = "0.0.0-dev" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio              = { version = "1", features = ["rt"] }
tombi-diagnostic   = { version = "0.0.0-dev", default-features = false, features = [
  "lsp"
] }
tombi-formatter    = { version = "0.0.0-dev", default-features = false, features = [
  "native"
] }
tombi-schema-store = { version = "0.0.0-dev", default-features = false, features = [
  "native"
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tombi-diagnostic   = { version = "0.0.0-dev", default-features = false }
tombi-formatter    = { version = "0.0.0-dev", default-features = false, features = [
  "wasm"
] }
tombi-schema-store = { version = "0.0.0-dev", default-features = false, features = [
  "wasm"
] }

[features]
default = []
schema  = ["dep:schemars"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cargo                         = "warn"
#cargo.multiple_crate_versions = "allow"
complexity                    = "deny"
correctness                   = "deny"
nursery                       = "deny"
pedantic                      = "forbid"
perf                          = "deny"
style                         = "deny"
suspicious                    = "deny"

[patch.crates-io]
tombi-config       = { git = "https://github.com/kjanat/tombi.git", branch = "clippy-stuffs" }
tombi-diagnostic   = { git = "https://github.com/kjanat/tombi.git", branch = "clippy-stuffs" }
tombi-formatter    = { git = "https://github.com/kjanat/tombi.git", branch = "clippy-stuffs" }
tombi-parser       = { git = "https://github.com/kjanat/tombi.git", branch = "clippy-stuffs" }
tombi-schema-store = { git = "https://github.com/kjanat/tombi.git", branch = "clippy-stuffs" }
tombi-toml-version = { git = "https://github.com/kjanat/tombi.git", branch = "clippy-stuffs" }

[profile.release]
opt-level = "s"
lto       = true
