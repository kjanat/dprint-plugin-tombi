name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Validate version matches tag
        run: |
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: Cargo.toml has $CARGO_VERSION but tag is $TAG_VERSION"
            exit 1
          fi
          echo "Version validated: $TAG_VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-features

      - name: Generate schema
        run: cargo run --bin generate-schema --features schema

      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Rename plugin for dprint proxy
        run: cp target/wasm32-unknown-unknown/release/dprint_plugin_tombi.wasm plugin.wasm

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: |
            plugin.wasm
            schema.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin.wasm
            schema.json
          generate_release_notes: true
          append_body: true
          body: |

            ## Install

            [Install](https://dprint.dev/install/) and [setup](https://dprint.dev/setup/) dprint.

            Then in your project's dprint configuration file:

            1. Specify the plugin url in the `plugins` array (or run `dprint config add kjanat/tombi`).
            2. Add a `tombi` configuration property if desired.

               ```jsonc
               {
                 // ...etc...
                 "tombi": {},
                 "plugins": [
                   "https://plugins.dprint.dev/kjanat/tombi-${{ github.ref_name }}.wasm"
                 ]
               }
               ```
