name: Release
run-name: ${{ inputs.beepboop_title || github.event.head_commit.message || github.ref_name }}

# A pushed tag is released as it is. A push to master that updates Tombi (the
# resolved Tombi commit in Cargo.lock) is released as the next
# patch version: the first release is the version in Cargo.toml. A temporary
# branch gives CI the version-bump commit. The release job tags it after CI.
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id: { description: Beepboop execution ID, type: string, required: true }
      beepboop_title: { description: Release run title, type: string }
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
    branches: [master]
    paths: [Cargo.toml, Cargo.lock]
permissions: { contents: read }
concurrency: { group: release, cancel-in-progress: false }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, id-token: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha || steps.tag.outputs.sha }}
      candidate: ${{ steps.tag.outputs.candidate }}
      draft: ${{ steps.beepboop.outputs.context && fromJSON(steps.beepboop.outputs.context).draftRelease.id || '' }}
    steps:
      - name: Read the approved Beepboop release
        if: github.event_name == 'workflow_dispatch'
        id: beepboop
        uses: kjanat/beepboop/actions/begin@v1
        with:
          operation: promote
          execution-id: ${{ inputs.beepboop_execution_id }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && fromJSON(steps.beepboop.outputs.context).sourceSha || github.sha }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with: { toolchain: stable }
      - name: The tag to release
        id: tag
        shell: python
        env:
          BEFORE: ${{ github.event.before }}
          BEEPBOOP_VERSION: ${{ github.event_name == 'workflow_dispatch' && fromJSON(steps.beepboop.outputs.context).version || '' }}
          BEEPBOOP_SOURCE: ${{ github.event_name == 'workflow_dispatch' && fromJSON(steps.beepboop.outputs.context).sourceSha || '' }}
        run: |
          import os
          import re
          import subprocess
          import tomllib


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          def output(tag, candidate=""):
              with open(os.environ["GITHUB_OUTPUT"], "a") as file:
                  file.write(f"tag={tag}\n")
                  if tag:
                      file.write(f"sha={git('rev-parse', 'HEAD').strip()}\ncandidate={candidate}\n")


          def tombi_revisions(revision):
              lock = tomllib.loads(git("show", f"{revision}:Cargo.lock"))
              commits = set()
              for package in lock["package"]:
                  source = package.get("source", "")
                  match = re.fullmatch(r"git\+https://github\.com/kjanat/tombi(?:\?[^#]*)?#([0-9a-f]{40})", source)
                  if match:
                      commits.add(match.group(1))
              return sorted(commits)


          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              version = os.environ["BEEPBOOP_VERSION"]
              source = os.environ["BEEPBOOP_SOURCE"]
              if not re.fullmatch(r"[0-9a-f]{40}", source) or git("rev-parse", "HEAD").strip() != source:
                  raise SystemExit("Checkout does not match the approved release commit")
              with open("Cargo.toml", "rb") as manifest:
                  current = tomllib.load(manifest)["package"]["version"]
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) or version != current:
                  raise SystemExit(f"Approved version {version!r} does not match package version {current!r}")
              output(version)
              raise SystemExit(0)

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              output(os.environ["GITHUB_REF_NAME"])
              raise SystemExit(0)

          before, after = tombi_revisions(os.environ["BEFORE"]), tombi_revisions("HEAD")
          if before == after:
              print("Tombi isn't updated, so there's nothing to release")
              output("")
              raise SystemExit(0)
          print(f"Tombi updated: {before} -> {after}")

          with open("Cargo.toml", "rb") as manifest:
              current = tomllib.load(manifest)["package"]["version"]
          tags = [tag for tag in git("tag", "--list").split() if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag)]
          if tags:
              major, minor, patch = max(tuple(int(part) for part in tag.split(".")) for tag in tags)
              version = f"{major}.{minor}.{patch + 1}"
          else:
              version = current


          def bump(path, pattern):
              with open(path, encoding="utf-8", newline="") as file:
                  text = file.read()
              text, count = re.subn(
                  pattern + re.escape(current) + r'(")',
                  lambda match: match.group(1) + version + match.group(2),
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"No version to bump in {path}")
              with open(path, "w", encoding="utf-8", newline="") as file:
                  file.write(text)


          candidate = ""
          if version != current:
              # Keep the manifest's alignment and regenerate the derived files.
              bump("Cargo.toml", r'^(version\s*=\s*")')
              subprocess.run(["cargo", "update", "--workspace"], check=True)
              subprocess.run(["cargo", "run", "--locked", "--bin", "generate-schema", "--features", "schema"], check=True)
              candidate = f"release-candidate/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          output(version, candidate)
      - uses: kjanat/beepboop/actions/token@v1
        if: steps.tag.outputs.candidate != ''
        id: bot
        with: { permission-contents: write }
      - name: Create the signed release candidate as Beepboop
        if: steps.tag.outputs.candidate != ''
        id: candidate
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          CANDIDATE: ${{ steps.tag.outputs.candidate }}
          SOURCE_SHA: ${{ steps.tag.outputs.sha }}
          VERSION: ${{ steps.tag.outputs.tag }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$CANDIDATE" -f sha="$SOURCE_SHA" --silent
          sha=$(jq -n --arg repo "$GITHUB_REPOSITORY" --arg ref "refs/heads/$CANDIDATE" \
            --arg parent "$SOURCE_SHA" --arg version "$VERSION" \
            --rawfile manifest Cargo.toml --rawfile lock Cargo.lock --rawfile schema schema.json '
              {query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid } } } }",
               variables: {input: {branch: {repositoryNameWithOwner: $repo, refName: $ref},
                 expectedHeadOid: $parent, message: {headline: $version}, fileChanges: {additions: [
                   {path: "Cargo.toml", contents: ($manifest | @base64)},
                   {path: "Cargo.lock", contents: ($lock | @base64)},
                   {path: "schema.json", contents: ($schema | @base64)}]}}}}
            ' | gh api graphql --input - --jq '.data.createCommitOnBranch.commit | select(.signature.isValid == true) | .oid')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::GitHub did not return a verified candidate commit'
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
  verify:
    needs: plan
    if: needs.plan.outputs.tag != ''
    uses: "$/.github/workflows/ci.yml"
    with: { ref: "${{ needs.plan.outputs.sha }}" }
  release:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
          ref: ${{ needs.plan.outputs.sha }}
      - name: Validate bare semver and package version
        env: { TAG: "${{ needs.plan.outputs.tag }}" }
        shell: python
        run: |
          import os
          import re
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["TAG"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != version:
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plugin }
      - name: Push the verified version tag
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env: { TAG: "${{ needs.plan.outputs.tag }}" }
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$TAG" HEAD
          fi
          git push origin "refs/tags/$TAG"
      - name: Push the authorized version tag
        if: github.event_name == 'workflow_dispatch'
        uses: kjanat/beepboop/actions/publish-refs@v1
        env: { BEEPBOOP_EXECUTION_ID: "${{ inputs.beepboop_execution_id }}" }
        with:
          # The workflow token prevents a second run of this workflow on the tag push.
          token: ${{ github.token }}
      - name: Upload the tested assets to the Beepboop draft
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          DRAFT_ID: ${{ needs.plan.outputs.draft }}
        run: |
          release=$(gh release view "$TAG" --json databaseId,isDraft --jq 'select(.isDraft) | .databaseId')
          if [[ -z "$DRAFT_ID" || "$release" != "$DRAFT_ID" ]]; then
            echo "::error::Expected Beepboop draft $DRAFT_ID for $TAG"
            exit 1
          fi
          gh release upload "$TAG" plugin.wasm schema.json
      - name: Publish the Beepboop draft and record the publication
        if: github.event_name == 'workflow_dispatch'
        uses: kjanat/beepboop/actions/publish-release@v1
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
      - name: Publish the tested artifact without replacing existing releases
        if: github.event_name == 'push'
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ needs.plan.outputs.tag }}" }
        run: |
          cat > release-notes.md <<'EOF'
          ## Tombi formatter for dprint

          Uses the upstream Tombi Rust formatter in dprint's WASM sandbox.
          The configuration key is `toml`, not `tombi`.

          Add using:

          ```sh
          dprint add kjanat/tombi
          ```

          Or download `plugin.wasm` and reference its local path in your dprint config.
          See the README for sandbox limitations and configuration.
          EOF
          gh release create "$TAG" plugin.wasm schema.json \
            --verify-tag --title "$TAG" \
            --notes-file release-notes.md --generate-notes
      - name: Delete the published candidate branch
        if: needs.plan.outputs.candidate != ''
        continue-on-error: true
        env: { CANDIDATE: "${{ needs.plan.outputs.candidate }}" }
        run: git push origin --delete "$CANDIDATE"
  report:
    needs: [plan, release]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.plan.outputs.tag != '' && needs.release.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: { id-token: write }
    steps:
      - name: Record the publication outcome
        id: publication
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          PUBLISH_RESULT: ${{ needs.release.result }}
        run: |
          report=$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$TAG" \
            --arg result "$PUBLISH_RESULT" '
              [{id: ("github-release:" + $repository), manager: "github-release", name: $repository, version: $version}
               + (if $result == "cancelled" then {outcome: "uncertain"}
                  elif $result == "skipped" then {outcome: "skipped"}
                  else {outcome: "failed"}
                  end)]')
          printf 'report=%s\n' "$report" >> "$GITHUB_OUTPUT"
      - name: Report the GitHub release
        uses: kjanat/beepboop/actions/report@v1
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          publications: ${{ steps.publication.outputs.report }}
