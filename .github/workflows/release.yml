name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate bare semver and package version
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag) or tag != version:
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY
      - uses: actions/download-artifact@v6
        with:
          name: plugin
      - name: Publish the tested artifact without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## Tombi formatter for dprint

          Uses the upstream Tombi Rust formatter in dprint's WASM sandbox.
          The configuration key is `toml`, not `tombi`.

          Download `plugin.wasm` and reference its local path in your dprint config.
          For a public repository/release, use `dprint add --checksum kjanat/tombi`.
          See the README for sandbox limitations and configuration.
          EOF
          gh release create "$GITHUB_REF_NAME" plugin.wasm schema.json \
            --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md --generate-notes
