name: Auto release

# A merged pull request that updates Tombi (the revision of the tombi-*
# dependencies in Cargo.toml) is released as the next patch version. Other
# updates aren't released on their own.
#
# Only the tag is pushed, on a commit that bumps the version on top of
# master: the master ruleset requires CI for every push, and GitHub Actions
# can't bypass a ruleset of a personal repository. The release workflow is
# dispatched for the tag, as a tag pushed with GITHUB_TOKEN doesn't trigger
# workflows.
on:
  push:
    branches: [master]
    paths: [Cargo.toml]

permissions: { contents: read }

concurrency: { group: auto-release, cancel-in-progress: false }

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release tag
      actions: write # dispatch the release workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Tag a Tombi update as the next version
        id: tag
        shell: python
        run: |
          import os
          import re
          import subprocess
          import tomllib


          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True, text=True).stdout


          def tombi_revisions(revision):
              manifest = tomllib.loads(git("show", f"{revision}:Cargo.toml"))
              return {
                  name: dependency.get("rev")
                  for name, dependency in manifest.get("dependencies", {}).items()
                  if name.startswith("tombi-") and isinstance(dependency, dict)
              }


          def output(version):
              with open(os.environ["GITHUB_OUTPUT"], "a") as file:
                  file.write(f"version={version}\n")


          before, after = tombi_revisions("HEAD^1"), tombi_revisions("HEAD")
          if before == after:
              print("Tombi isn't updated, so there's nothing to release")
              output("")
              raise SystemExit(0)
          print(f"Tombi updated: {before} -> {after}")

          with open("Cargo.toml", "rb") as manifest:
              current = tomllib.load(manifest)["package"]["version"]
          tags = [tag for tag in git("tag", "--list").split() if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", tag)]
          if tags:
              major, minor, patch = max(tuple(int(part) for part in tag.split(".")) for tag in tags)
              version = f"{major}.{minor}.{patch + 1}"
          else:
              version = current


          def bump(path, pattern):
              with open(path, encoding="utf-8", newline="") as file:
                  text = file.read()
              text, count = re.subn(
                  pattern + re.escape(current) + r'(")',
                  lambda match: match.group(1) + version + match.group(2),
                  text,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"No version to bump in {path}")
              with open(path, "w", encoding="utf-8", newline="") as file:
                  file.write(text)


          if version != current:
              # only the version, keeping the manifest's alignment
              bump("Cargo.toml", r'^(version\s*=\s*")')
              bump("Cargo.lock", r'(name = "dprint-plugin-tombi"\nversion = ")')
              git("switch", "--create", f"release/{version}")
              git(
                  "-c", "user.name=github-actions[bot]",
                  "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com",
                  "commit", "--all", "--message", version,
              )
          git("tag", version)
          git("push", "origin", f"refs/tags/{version}")
          output(version)
      - name: Release the tag
        if: steps.tag.outputs.version != ''
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ steps.tag.outputs.version }}" }
        run: gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${VERSION}"
