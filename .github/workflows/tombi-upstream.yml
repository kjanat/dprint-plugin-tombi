name: Tombi upstream

on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # open the rebase issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Open an issue for a newer Tombi release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          current=v$(grep -oE 'dprint/v[0-9]+\.[0-9]+\.[0-9]+-headless' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          latest=$(gh api repos/tombi-toml/tombi/releases/latest --jq .tag_name)
          echo "Plugin on ${current}, latest ${latest}"
          if [[ -z "${current}" || -z "${latest}" ]]; then
            echo "::error::Couldn't read the plugin's or the latest Tombi version"
            exit 1
          fi
          if [[ "$(printf '%s\n%s\n' "${current#v}" "${latest#v}" | sort -V | tail -1)" == "${current#v}" ]]; then
            exit 0
          fi
          title="Update Tombi to ${latest}"
          if [[ -n "$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')" ]]; then
            echo "An issue is open already"
            exit 0
          fi
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" \
            --body "Tombi ${latest} is out; the plugin uses ${current}. See \"Updating\" in UPSTREAM.md."

  # Moves Tombi to the newest dprint/vX.Y.Z-headless branch of the fork, or to
  # the newest commit of the current one, in a pull request from the Beepboop
  # App. Its token needs a run the owner started, so no push trigger.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Beepboop App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Select the newest fork branch
        id: version
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          current=$(grep -oE 'dprint/v[0-9]+\.[0-9]+\.[0-9]+-headless' Cargo.toml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          latest=$(git ls-remote --heads https://github.com/kjanat/tombi 'dprint/v*-headless' \
            | grep -oE 'dprint/v[0-9]+\.[0-9]+\.[0-9]+-headless$' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          if [[ -z "${current}" || -z "${latest}" ]]; then
            echo "::error::Couldn't read the current or the newest fork branch"
            exit 1
          fi
          echo "Plugin on ${current}, newest fork branch ${latest}"
          echo "version=${latest}" >> "${GITHUB_OUTPUT}"
          if [[ "${latest}" == "${current}" || "$(printf '%s\n%s\n' "${current}" "${latest}" | sort -V | tail -1)" == "${current}" ]]; then
            exit 0
          fi
          archive="tombi-cli-${latest}-x86_64-unknown-linux-musl.tar.gz"
          digest=$(gh api "repos/tombi-toml/tombi/releases/tags/v${latest}" \
            --jq ".assets[] | select(.name == \"${archive}\") | .digest" | sed -n 's/^sha256://p')
          if [[ -z "${digest}" ]]; then
            echo "::error::Couldn't read the digest of upstream v${latest}'s ${archive}"
            exit 1
          fi
          sed -i "s|dprint/v${current}-headless|dprint/v${latest}-headless|g" Cargo.toml
          echo "${digest}  ${archive}" > .github/tombi-cli.sha256
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: stable }
      - name: Update Cargo.lock and schema.json
        run: |
          cargo update -p serde_tombi -p tombi-config -p tombi-formatter -p tombi-fs -p tombi-schema-store -p tombi-uri
          cargo run --locked --bin generate-schema --features schema
          commit=$(grep -oE 'git\+https://github\.com/kjanat/tombi\?[^#]*#[0-9a-f]{40}' Cargo.lock | head -1 | grep -oE '[0-9a-f]{40}$')
          echo "COMMIT=${commit:0:7}" >> "${GITHUB_ENV}"
      - uses: kjanat/beepboop/actions/pull-request@dde69af5b5d106bd593fb4dc155cc70ca3fbe475 # v1.5.3
        with:
          branch: tombi/update
          title: "fix(deps): update Tombi to v${{ steps.version.outputs.version }} (${{ env.COMMIT }})"
          body: |
            Moves every Tombi crate to `dprint/v${{ steps.version.outputs.version }}-headless` of kjanat/tombi at ${{ env.COMMIT }}.
            Merging it releases the plugin (release.yml).
          add-paths: |
            Cargo.toml
            Cargo.lock
            schema.json
            .github/tombi-cli.sha256
