name: Tombi upstream

on:
  schedule: [{ cron: "0 6 * * 1" }]
  workflow_dispatch:

permissions: { contents: read }

jobs:
  # Update the engine dependencies, lockfile, and generated schema together.
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: tombi-update, cancel-in-progress: false }
    permissions:
      contents: read
      id-token: write # Beepboop App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ github.event.repository.default_branch }}" }
      - name: Select the newest fork branch
        id: version
        run: python3 scripts/tombi-upstream.py select
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: stable }
      - name: Update Cargo.lock and schema.json
        id: update
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          cargo update -p serde_tombi -p tombi-config -p tombi-formatter -p tombi-fs -p tombi-schema-store -p tombi-uri
          python3 scripts/tombi-upstream.py verify "$BRANCH" "$COMMIT"
          cargo run --locked --bin generate-schema --features schema
          remote=$(git ls-remote --exit-code origin "refs/heads/$DEFAULT_BRANCH")
          if [[ "${remote%%$'\t'*}" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::The default branch moved while preparing the Tombi update'
            exit 1
          fi
          echo "short_commit=${COMMIT:0:7}" >> "$GITHUB_OUTPUT"
      - uses: kjanat/beepboop/actions/pull-request@v1
        with:
          branch: tombi/update
          title: "fix(deps): update Tombi to v${{ steps.version.outputs.version }} (${{ steps.update.outputs.short_commit }})"
          body: |
            Moves every Tombi crate to `dprint/v${{ steps.version.outputs.version }}-headless` of kjanat/tombi at `${{ steps.version.outputs.commit }}`.

            [Review the fork changes since the upstream tag](${{ steps.update.outputs.compare }}).

            Merging it releases the plugin (release.yml).
          add-paths: |
            Cargo.toml
            Cargo.lock
            schema.json
