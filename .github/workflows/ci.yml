name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting and tracked generated files
        run: |
          cargo fmt --all -- --check
          git ls-files --error-unmatch Cargo.lock schema.json
      - name: Native tests
        run: cargo test --locked --all-features
      - name: Check generated schema
        run: |
          cargo run --locked --bin generate-schema --features schema
          git diff --exit-code -- Cargo.lock schema.json
      - name: Strict native and Wasm lint
        run: |
          cargo lint
          cargo lint-wasm
      - name: Build the actual plugin
        run: cargo wasm --locked
      - name: Install pinned dprint CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/dprint" --no-audit --no-fund dprint@0.57.4
          echo "$RUNNER_TEMP/dprint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Execute Wasm and audit imports
        run: node scripts/wasm-smoke.mjs
      - name: Stage the verified artifact
        run: cp target/wasm32-unknown-unknown/wasm-release/dprint_plugin_tombi.wasm plugin.wasm
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin
          path: |
            plugin.wasm
            schema.json
          if-no-files-found: error
