name: CI

on:
  push: { branches: [master] }
  pull_request: { branches: [master] }
  workflow_call:
    inputs:
      ref: { description: "The commit to check (default: the one that triggered the caller)", type: string, default: "" }

permissions: { contents: read }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env: { CARGO_TERM_COLOR: always }

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ inputs.ref }}" }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: stable, components: "clippy, rustfmt", targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting and tracked generated files
        run: |
          cargo fmt --all -- --check
          git ls-files --error-unmatch Cargo.lock schema.json
      - name: Native tests
        run: cargo test --locked --all-features
      - name: Check generated schema
        run: |
          cargo run --locked --bin generate-schema --features schema
          git diff --exit-code -- Cargo.lock schema.json
      - name: Strict native and Wasm lint
        run: cargo lint && cargo lint-wasm
      - name: Build the actual plugin
        run: cargo wasm --locked
      - name: Stage the built artifact
        run: cp target/wasm32-unknown-unknown/wasm-release/dprint_plugin_tombi.wasm plugin.wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: plugin, path: "plugin.wasm\nschema.json", if-no-files-found: error }

  # the built plugin, run by the dprint of kjanat/dprint and by upstream's
  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        dprint:
          - { repository: kjanat/dprint, version: latest }
          - { repository: dprint/dprint, version: latest }
    name: smoke (${{ matrix.dprint.repository }} ${{ matrix.dprint.version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ inputs.ref }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plugin }
      - name: Install dprint
        uses: kjanat/dprint-check@v3
        with: { install-only: true, repository: "${{ matrix.dprint.repository }}", dprint-version: "${{ matrix.dprint.version }}" }
      - name: Execute Wasm and audit imports
        run: node scripts/wasm-smoke.mjs plugin.wasm

  parity:
    name: Configuration and schema parity
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, ref: "${{ inputs.ref }}" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: plugin }
      # The latest kprint release predates schema support. Build the merged fix
      # until a release containing it is available.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kjanat/kprint
          ref: 1a71599f4f7bceca1489c2bfb37664ee0e9686f3
          path: kprint-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with: { toolchain: "1.99" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with: { workspaces: kprint-source, key: "kprint-1a71599f4f7bceca1489c2bfb37664ee0e9686f3" }
      - name: Build the pinned kprint revision
        working-directory: kprint-source
        run: cargo build --locked --release -p kprint
      - name: Install Tombi 1.11.1
        run: |
          curl -fsSL https://github.com/tombi-toml/tombi/releases/download/v1.11.1/tombi-cli-1.11.1-x86_64-unknown-linux-musl.tar.gz -o "${RUNNER_TEMP}/tombi.tar.gz"
          echo '20ad530e4878c8214e40e14e92623fd2ef244254a397a5cab29137f9076c156e  '"${RUNNER_TEMP}"'/tombi.tar.gz' | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/tombi.tar.gz" -C "${RUNNER_TEMP}" --strip-components=1
      - name: Compare configuration and schema behavior
        env:
          KPRINT_BIN: ${{ github.workspace }}/kprint-source/target/release/kprint
          TOMBI_BIN: ${{ runner.temp }}/tombi
        run: |
          node scripts/schema-parity.mjs plugin.wasm
          node scripts/remote-config-parity.mjs plugin.wasm
