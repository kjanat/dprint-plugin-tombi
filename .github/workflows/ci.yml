name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Resolve lockfile for initial migration
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: Generate schema
        run: cargo run --locked --bin generate-schema --features schema
      - name: Native tests
        run: cargo test --locked --all-features
      - name: Build the actual plugin
        run: cargo wasm --locked
      - name: Install pinned dprint CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/dprint" --no-audit --no-fund dprint@0.57.4
          echo "$RUNNER_TEMP/dprint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Execute Wasm and audit imports
        run: node scripts/wasm-smoke.mjs
      - name: Strict native and Wasm lint
        run: |
          cargo lint
          cargo lint-wasm
      - name: Check formatting and tracked generated files
        run: |
          cargo fmt --all -- --check
          git ls-files --error-unmatch Cargo.lock schema.json
          git diff --exit-code -- Cargo.lock schema.json
      - name: Collect migration diagnostics
        if: always()
        run: |
          cargo fmt --all
          git diff --binary > formatting.patch
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-diagnostics
          path: |
            Cargo.lock
            schema.json
            formatting.patch
          if-no-files-found: warn
      - name: Stage release artifacts
        run: cp target/wasm32-unknown-unknown/wasm-release/dprint_plugin_tombi.wasm plugin.wasm
      - uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: |
            plugin.wasm
            schema.json
