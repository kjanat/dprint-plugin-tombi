name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Resolve lockfile for initial migration
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: Install pinned build tools
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test the Wasm finalizer
        run: npm run test:build
      - name: Generate schema
        run: cargo run --locked --bin generate-schema --features schema
      - name: Native tests
        run: cargo test --locked --all-features
      - name: Build the actual plugin
        run: npm run build:wasm
      - name: Install pinned dprint CLI
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/dprint" --no-audit --no-fund dprint@0.57.4
          echo "$RUNNER_TEMP/dprint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Execute Wasm and audit imports
        run: node scripts/wasm-smoke.mjs
      - name: Strict native lint
        if: ${{ !cancelled() }}
        run: cargo lint
      - name: Strict Wasm lint
        if: ${{ !cancelled() }}
        run: cargo lint-wasm
      - name: Check formatting and tracked generated files
        run: |
          cargo fmt --all -- --check
          git ls-files --error-unmatch Cargo.lock schema.json package-lock.json
          git diff --exit-code -- Cargo.lock schema.json package-lock.json
      - name: Collect migration diagnostics
        if: always()
        run: |
          cargo fmt --all
          git diff --binary > formatting.patch
          mkdir -p generated/src/bin generated/tests
          cp Cargo.lock schema.json package-lock.json generated/
          cp src/*.rs generated/src/
          cp src/bin/*.rs generated/src/bin/
          cp tests/*.rs generated/tests/
          mkdir -p wasm-debug/node_modules
          cp target/wasm32-unknown-unknown/wasm-release/dprint_plugin_tombi.wasm wasm-debug/raw.wasm
          cp -r node_modules/binaryen wasm-debug/node_modules/
          cp -r "$RUNNER_TEMP/dprint" wasm-debug/dprint
          node --input-type=module -e '
            import fs from "node:fs";
            const m = new WebAssembly.Module(fs.readFileSync("wasm-debug/raw.wasm"));
            const data = { exports: WebAssembly.Module.exports(m), imports: WebAssembly.Module.imports(m) };
            fs.writeFileSync("wasm-debug/abi.json", JSON.stringify(data, null, 2));
            console.log(JSON.stringify(data));
          '
      - name: Upload generated migration files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-generated
          path: generated/
          if-no-files-found: error
      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: migration-diagnostics
          path: |
            Cargo.lock
            schema.json
            package-lock.json
            formatting.patch
            dist/plugin.wasm
          if-no-files-found: warn
      - name: Upload Wasm debugging bundle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-debug
          path: wasm-debug/
          if-no-files-found: warn
      - name: Stage release artifacts
        run: cp dist/plugin.wasm plugin.wasm
      - uses: actions/upload-artifact@v6
        with:
          name: plugin
          path: |
            plugin.wasm
            schema.json

  # One-time migration helper. It only creates content-addressed blobs, never
  # commits or refs. Build code executes in the separate read-only verify job.
  stage-generated-blobs:
    needs: verify
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'repair/tombi-wasm'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: migration-generated
          path: generated
      - name: Stage exact generated bytes without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('generated').resolve()
          paths = ['Cargo.lock', 'schema.json', 'package-lock.json',
                   'src/lib.rs', 'src/configuration.rs', 'src/handler.rs',
                   'src/bin/generate_schema.rs', 'tests/format.rs']
          entries = []
          for name in paths:
              path = root / name
              if path.is_symlink() or not path.resolve().is_relative_to(root):
                  raise RuntimeError('Unsafe artifact path')
              data = path.read_bytes()
              if len(data) > 1_000_000:
                  raise RuntimeError('Unexpected artifact size')
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  headers={'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
              if sha != expected:
                  raise RuntimeError('Uploaded blob identity mismatch')
              entries.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': sha})
          print(json.dumps(entries, indent=2))
          pathlib.Path('generated-blobs.json').write_text(json.dumps(entries, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: generated-blobs
          path: generated-blobs.json
