[package]
name = "tombi-future"
version = "0.0.0-dev"
edition = "2024"
license = "MIT"
repository = "https://github.com/tombi-toml/tombi"
description = "Tombi future helpers with browser task spawning explicitly opt-in"
publish = false

[dependencies]
futures = "0.3.31"
send_wrapper = { version = "0.6.0", features = ["futures"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", default-features = false, features = ["rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
native = []
wasm = ["dep:wasm-bindgen-futures"]
wasm-send = ["dep:send_wrapper"]
